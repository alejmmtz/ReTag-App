$kind: http-request
name: Update Transaction Status
method: PATCH
url: '{{baseUrl}}/transactions/:id/status'
order: 4000
pathVariables:
  - key: id
    value: '00000000-0000-0000-0000-000000000001'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "in_progress"
    }
