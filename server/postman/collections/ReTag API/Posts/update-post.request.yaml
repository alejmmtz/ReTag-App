$kind: http-request
name: Update Post
method: PUT
url: '{{baseUrl}}/posts/:id'
order: 4000
pathVariables:
  - key: id
    value: '00000000-0000-0000-0000-000000000001'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "caption": "Updated caption for this post.",
      "images": [
        "https://example.com/updated-image.jpg"
      ]
    }
