$kind: collection
description: |-
  Complete HTTP API for the ReTag App server.
  Global prefix: retag-server/api
  Base URL: {{baseUrl}}  (e.g. http://localhost:3000/retag-server/api)
  Authentication: Bearer JWT — set {{token}} after calling POST /auth/login.
variables:
  baseUrl: http://localhost:3000/retag-server/api
  token: ""
auth:
  type: bearer
  credentials:
    token: "{{token}}"
