$kind: http-request
name: "Get User's Garments"
method: GET
url: '{{baseUrl}}/users/:id/garments'
order: 3000
auth:
  type: noauth
pathVariables:
  - key: id
    value: '00000000-0000-0000-0000-000000000001'
queryParams:
  - key: status
    value: available
    description: 'Filter by garment status: available | traded | purchased'
    disabled: true
  - key: page
    value: '1'
    disabled: true
  - key: limit
    value: '10'
    disabled: true
