$kind: http-request
name: List Garments
method: GET
url: "{{baseUrl}}/garments?sortOrder=DESC"
order: 1000
auth:
  type: noauth
queryParams:
  - key: name
    value: jacket
    disabled: true
  - key: sizeId
    value: "1"
    disabled: true
  - key: brand
    value: "1"
    disabled: true
  - key: color
    value: "1"
    disabled: true
  - key: tag
    value: "1"
    disabled: true
  - key: material
    value: cotton
    disabled: true
    description: cotton | twill | voile | linen | silk | cotton silk | lyosell | viscose | hemp | mesh | poliester | velvet | elastane | canvas | panama | crêpe | georgette | gabardine | peach skin | u-circular
  - key: status
    value: available
    disabled: true
    description: available | traded | purchased
  - key: condition
    value: like new
    disabled: true
    description: like new | very good | good | acceptable | refurbished
  - key: transactionType
    value: sale
    disabled: true
    description: sale | trade | both
  - key: minPrice
    value: "0"
    disabled: true
  - key: maxPrice
    value: "500"
    disabled: true
  - key: sortOrder
    value: DESC
    disabled: false
